<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — W.K.D. Kavishka</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 2rem;
        background: #fafafa;
        color: #222;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.2rem;
      }
      a, button {
        display: inline-block;
        margin: 0.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171717; color: #fafafa; }
      }
    </style>
  </head>
  <body>
    <h1>Offline</h1>
    <p>This page is not available offline. Saved portfolio pages can still be opened from the homepage.</p>
    <p>Sending messages and opening external sites require an internet connection.</p>
    <a href="/">Go to homepage</a>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
